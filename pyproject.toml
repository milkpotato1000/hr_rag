[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "milkpotato-rag-lab"
dynamic = ["version"]
description = "Offline-first document RAG learning CLI"
readme = "PACKAGING.md"
requires-python = ">=3.10"
license-files = []
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf==6.21.2"]
drive = ["google-auth-oauthlib==1.5.0", "google-auth==2.63.1"]
retrieval = ["sentence-transformers==6.3.0", "torch==2.15.0", "transformers==5.24.1"]
all = ["sentence-transformers==6.3.0", "torch==2.15.0", "transformers==5.24.1", "pypdf==6.21.2", "google-auth-oauthlib==1.5.0", "google-auth==2.63.1"]

[project.scripts]
rag-lab = "rag_package.__main__:main"

[tool.setuptools]
packages = ["rag_package", "rag_package.llm", "rag_package.connectors"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "rag_package._version.__version__"}

[tool.setuptools.package-data]
rag_package = ["provenance.json", "requirements-pdf.lock", "requirements-drive.lock", "resources/manifest.json", "resources/sample/sources.json", "resources/sample/questions.json", "resources/sample/documents/birthday.md", "resources/sample/documents/handbook.pdf", "resources/sample/documents/annual.txt", "resources/sample/fixed.json", "resources/sample/recursive.json", "resources/sample/structure.json", "resources/sample/llm-local.json", "resources/sample/llm-api.json", "resources/sample/drive-token-env.json", "resources/sample/drive-oauth-file.json", "resources/sample/.gitignore", "resources/sample/START_HERE.md", "resources/sample/HANDBOOK.md", "resources/sample/handbook-sources.json", "resources/sample/handbook-local.json", "resources/sample/handbook-qwen-spec.json", "ui/index.html", "ui/app.js", "ui/style.css", "requirements-retrieval.lock", "resources/sample/chunk-handbook.json", "resources/sample/chunk-structure.json", "resources/sample/embedding-e5.json", "resources/sample/chunk-llm.json", "resources/sample/reranker-bge.json", "resources/sample/chunk-semantic.json", "resources/sample/rag-hybrid.json", "resources/sample/llm-chunking.json", "resources/sample/chunk-recursive.json", "resources/sample/rag-frozen.json", "resources/sample/chunk-fixed.json", "resources/models/bge-reranker.json", "resources/models/bge.json", "resources/models/e5.json", "resources/models/mmini-reranker.json", "resources/sample/llm-spec-api.json", "resources/sample/llm-spec-local.json", "resources/sample/llm-spec-mixed.json"]
